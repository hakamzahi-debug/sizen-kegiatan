name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Generate APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK Platform & Accept Licenses
        run: |
          SDKMANAGER=$(which sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          yes | $SDKMANAGER --licenses || true
          $SDKMANAGER "platforms;android-35" "build-tools;35.0.0" || true
          yes | $SDKMANAGER --licenses || true

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web & Sync Capacitor
        run: |
          npm run build
          npx cap sync android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: |
          cd android
          chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JadwalKu-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
